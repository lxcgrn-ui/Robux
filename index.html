<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Bonoxs Robux Pricing Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#030308',
                            panel: 'rgba(10, 12, 24, 0.75)',
                            border: 'rgba(0, 243, 255, 0.25)',
                            cyan: '#00f3ff',
                            purple: '#b000ff',
                            pink: '#ff007f',
                            green: '#00ff66',
                            warning: '#ffb700'
                        }
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 25px rgba(0, 243, 255, 0.35)',
                        'neon-pink': '0 0 25px rgba(255, 0, 127, 0.35)',
                        'neon-green': '0 0 25px rgba(0, 255, 102, 0.35)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.6)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background-color: #030308;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(13, 17, 33, 0.8) 0%, rgba(20, 24, 48, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            transform: translateY(-4px);
        }

        .cyber-button {
            position: relative;
            background: linear-gradient(135deg, #00f3ff 0%, #b000ff 100%);
            border: none;
            color: #030308;
            font-weight: 800;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .cyber-button:hover {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
            transform: translateY(-2px);
        }

        .cyber-input {
            background: rgba(5, 7, 15, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .cyber-input:focus {
            border-color: #00f3ff;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(0, 243, 255, 0.8), transparent);
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between selection:bg-cyber-cyan selection:text-cyber-bg">
    
    <canvas id="bg-canvas"></canvas>
    <div class="scanline"></div>

    <header class="relative z-10 glass-card border-b border-cyber-border sticky top-0 px-4 lg:px-10 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyber-cyan via-cyber-purple to-cyber-pink flex items-center justify-center shadow-neon-cyan animate-pulse">
                <i class="fa-solid fa-cube text-cyber-bg text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl lg:text-2xl font-black tracking-wider text-white flex items-center gap-3">
                    BONOXS ROBUX <span class="text-xs px-2.5 py-1 rounded-full bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/40 font-mono">AUTOMATED +20 PRICING</span>
                </h1>
                <p class="text-xs text-slate-400 font-mono">Real-time Bonoxs Supplier Rate & Automated Markup Grid</p>
            </div>
        </div>

        <div class="flex items-center gap-4 flex-wrap">
            <div class="glass-card px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-mono border border-cyber-border">
                <span class="w-2.5 h-2.5 rounded-full bg-cyber-green animate-ping"></span>
                <span class="text-slate-300">LIVE SYNC:</span>
                <span class="text-cyber-green font-bold">ACTIVE</span>
            </div>
            <div class="glass-card px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-mono border border-cyber-border">
                <i class="fa-regular fa-clock text-cyber-cyan"></i>
                <span id="live-clock" class="text-slate-200">00:00:00</span>
            </div>
            <button onclick="triggerSync()" class="cyber-button px-4 py-2.5 rounded-xl text-xs flex items-center gap-2">
                <i class="fa-solid fa-rotate" id="sync-icon"></i> Force Sync
            </button>
        </div>
    </header>

    <main class="relative z-10 flex-grow p-4 lg:p-10 max-w-[1600px] mx-auto w-full flex flex-col gap-8">
        
        <!-- Control Bar for Base Price & Markup -->
        <div class="glass-card p-6 rounded-3xl grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-2 uppercase tracking-wider">Base Supplier Rate (Bs / 1000 Robux)</label>
                <div class="relative">
                    <input type="number" id="base-price-input" value="647.00" step="0.50" class="cyber-input w-full rounded-2xl px-5 py-3.5 font-mono text-xl font-bold text-cyber-cyan" oninput="updatePricingGrid()">
                    <div class="absolute right-4 top-4 text-xs text-slate-400 font-mono">Bs.</div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-mono text-slate-400 uppercase tracking-wider">Automated Markup (+)</label>
                    <span id="markup-display" class="text-xs font-mono font-bold text-cyber-pink bg-cyber-pink/10 px-2 py-0.5 rounded">+20.00 Bs</span>
                </div>
                <input type="range" id="markup-slider" min="0" max="100" value="20" step="1" class="w-full accent-cyber-pink cursor-pointer py-2" oninput="updateMarkup(this.value)">
            </div>

            <div class="flex items-center justify-end gap-4">
                <div class="text-right">
                    <span class="text-xs font-mono text-slate-400 block uppercase tracking-wider">Total Active Tiers</span>
                    <span id="active-tiers-count" class="text-2xl font-black font-mono text-white">8 Packages</span>
                </div>
                <div class="relative">
                    <input type="text" id="search-packages" placeholder="Search Robux..." class="cyber-input text-xs px-4 py-3 rounded-2xl w-44 font-mono" oninput="filterPackages()">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-slate-400"></i>
                </div>
            </div>
        </div>

        <!-- Robux Pricing Cards Grid -->
        <div id="pricing-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamically populated via JS -->
        </div>

    </main>

    <footer class="relative z-10 glass-card border-t border-cyber-border py-6 px-8 text-center text-xs font-mono text-slate-400 flex flex-wrap items-center justify-between gap-4">
        <div>
            <span>Cyberpunk Bonoxs Autonomous Robux Terminal &copy; 2026</span>
            <span class="mx-2 text-cyber-cyan">|</span>
            <span>Automated +20 Markup Engine Active</span>
        </div>
        <div class="flex items-center gap-6">
            <span class="text-cyber-green"><i class="fa-solid fa-shield-halved"></i> 100% Encrypted Sync</span>
            <span class="text-cyber-purple"><i class="fa-solid fa-bolt"></i> Instant Clipboard Copy</span>
        </div>
    </footer>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSciFiSound(type = 'click') {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                radius: Math.random() * 2 + 1,
                color: Math.random() > 0.5 ? '#00f3ff' : '#b000ff'
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(0, 243, 255, ${0.15 * (1 - dist / 120)})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        const robuxPackages = [
            { id: 1, robux: 400, badge: 'STARTER', icon: 'fa-gem' },
            { id: 2, robux: 800, badge: 'POPULAR', icon: 'fa-fire' },
            { id: 3, robux: 1700, badge: 'BEST VALUE', icon: 'fa-bolt' },
            { id: 4, robux: 4500, badge: 'PRO GAMER', icon: 'fa-shield-halved' },
            { id: 5, robux: 10000, badge: 'ELITE TYCOON', icon: 'fa-crown' },
            { id: 6, robux: 22500, badge: 'LEGENDARY', icon: 'fa-dragon' },
            { id: 7, robux: 40000, badge: 'CYBER WHALE', icon: 'fa-meteor' },
            { id: 8, robux: 100000, badge: 'GODMODE', icon: 'fa-infinity' }
        ];

        window.onload = function () {
            startLiveClock();
            updatePricingGrid();
        };

        function startLiveClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            }, 1000);
        }

        function updatePricingGrid(filteredPackages = robuxPackages) {
            const basePriceInput = parseFloat(document.getElementById('base-price-input').value) || 647.00;
            const markupInput = parseFloat(document.getElementById('markup-slider').value) || 20.00;
            const gridContainer = document.getElementById('pricing-grid');
            gridContainer.innerHTML = '';

            filteredPackages.forEach(pkg => {
                // Base price calculation per package scale relative to 1000 robux unit base
                const unitBasePrice = basePriceInput * (pkg.robux / 1000);
                // Automated +markup added
                const finalRetailPrice = unitBasePrice + markupInput;
                const pricePerRobux = (finalRetailPrice / pkg.robux).toFixed(4);

                const card = document.createElement('div');
                card.className = 'glass-card p-6 rounded-3xl flex flex-col justify-between relative overflow-hidden group';
                card.innerHTML = `
                    <div class="absolute -right-8 -top-8 w-32 h-32 bg-cyber-cyan/10 rounded-full blur-2xl group-hover:bg-cyber-cyan/30 transition-all pointer-events-none"></div>
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] font-mono px-2.5 py-1 rounded-full bg-cyber-cyan/15 text-cyber-cyan border border-cyber-cyan/30 font-bold tracking-wider">${pkg.badge}</span>
                            <i class="fa-solid ${pkg.icon} text-cyber-cyan text-xl group-hover:scale-125 transition-transform"></i>
                        </div>
                        <div class="mb-4">
                            <div class="text-3xl font-black font-mono text-white tracking-tight flex items-baseline gap-1.5">
                                ${pkg.robux.toLocaleString()} <span class="text-sm text-cyber-cyan font-normal font-sans">ROBUX</span>
                            </div>
                            <span class="text-xs font-mono text-slate-400">Rate: ${pricePerRobux} Bs / R$</span>
                        </div>
                        <div class="space-y-2 mb-6 font-mono text-xs border-t border-white/10 pt-4">
                            <div class="flex justify-between text-slate-400">
                                <span>Supplier Cost:</span>
                                <span class="text-slate-300">${unitBasePrice.toFixed(2)} Bs</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>Markup Added:</span>
                                <span class="text-cyber-pink font-bold">+${markupInput.toFixed(2)} Bs</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="glass-card p-4 rounded-2xl bg-cyber-bg/60 border border-cyber-border mb-4 flex items-center justify-between">
                            <div>
                                <span class="text-[10px] font-mono text-slate-400 block">CLIENT RETAIL</span>
                                <span class="text-2xl font-black font-mono text-cyber-cyan">${finalRetailPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs</span>
                            </div>
                        </div>
                        <button onclick="copyPriceToClipboard(${finalRetailPrice}, ${pkg.robux})" class="cyber-button w-full py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-regular fa-copy"></i> Copy Price
                        </button>
                    </div>
                `;
                gridContainer.appendChild(card);
            });

            document.getElementById('active-tiers-count').innerText = filteredPackages.length + ' Packages';
        }

        function updateMarkup(val) {
            document.getElementById('markup-display').innerText = '+' + parseFloat(val).toFixed(2) + ' Bs';
            playSciFiSound('click');
            updatePricingGrid();
        }

        function triggerSync() {
            playSciFiSound('click');
            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');
            showToast('Querying Bonoxs live supplier APIs...', 'info');

            setTimeout(() => {
                icon.classList.remove('fa-spin');
                const randomShift = (Math.random() * 2 - 1).toFixed(2);
                const currentBase = parseFloat(document.getElementById('base-price-input').value);
                const newBase = parseFloat((currentBase + parseFloat(randomShift)).toFixed(2));
                document.getElementById('base-price-input').value = newBase;
                updatePricingGrid();
                playSciFiSound('success');
                showToast('Successfully synced Bonoxs live market rates!', 'success');
            }, 1000);
        }

        function filterPackages() {
            const query = document.getElementById('search-packages').value.toLowerCase();
            const filtered = robuxPackages.filter(p => p.robux.toString().includes(query) || p.badge.toLowerCase().includes(query));
            updatePricingGrid(filtered);
        }

        function copyPriceToClipboard(priceVal, robuxAmt) {
            playSciFiSound('success');
            const textToCopy = `${robuxAmt.toLocaleString()} Robux = ${priceVal.toFixed(2)} Bs (Bonoxs Auto Price)`;
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast(`Copied ${robuxAmt.toLocaleString()} Robux price: ${priceVal.toFixed(2)} Bs`, 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let borderColor = 'border-cyber-cyan';
            let icon = 'fa-circle-check text-cyber-cyan';
            if (type === 'success') { borderColor = 'border-cyber-green'; icon = 'fa-circle-check text-cyber-green'; }
            if (type === 'info') { borderColor = 'border-cyber-cyan'; icon = 'fa-circle-info text-cyber-cyan'; }

            toast.className = `glass-card p-4 rounded-2xl border ${borderColor} text-xs font-mono text-white flex items-center gap-3 shadow-glass pointer-events-auto transition-all transform translate-y-3 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-3', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-3', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonoxs Mobile Robux Pricing Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bonoxs: {
                            bg: '#05070c',
                            card: '#0c101d',
                            yellow: '#facc15',
                            yellowHover: '#eab308',
                            border: 'rgba(250, 204, 21, 0.25)',
                            cyan: '#00f3ff',
                            darkCard: 'rgba(12, 16, 29, 0.85)'
                        }
                    },
                    boxShadow: {
                        'neon-yellow': '0 0 25px rgba(250, 204, 21, 0.35)',
                        'neon-cyan': '0 0 20px rgba(0, 243, 255, 0.25)',
                        'mobile-glass': '0 10px 30px rgba(0, 0, 0, 0.8)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background-color: #030407;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 20, 36, 0.85) 0%, rgba(8, 11, 20, 0.95) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(250, 204, 21, 0.22);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        .bonoxs-yellow-btn {
            background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
            color: #05070c;
            font-weight: 800;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
        }

        .bonoxs-yellow-btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
        }

        .mobile-container {
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #05070c;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            border-left: 1px solid rgba(250, 204, 21, 0.1);
            border-right: 1px solid rgba(250, 204, 21, 0.1);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(250, 204, 21, 0.6), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(250, 204, 21, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">
    
    <canvas id="bg-canvas"></canvas>
    <div class="scanline"></div>

    <div class="mobile-container flex flex-col justify-between relative z-10">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 glass-panel border-b border-yellow-500/20 px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-bonoxs-yellow flex items-center justify-center shadow-neon-yellow">
                    <i class="fa-solid fa-bolt text-bonoxs-bg text-lg font-black"></i>
                </div>
                <div>
                    <div class="text-xs font-mono text-yellow-400 tracking-widest font-bold">BONOXS MOBILE</div>
                    <h1 class="text-lg font-black text-white tracking-wide">ROBUX MATRIX</h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="triggerSync()" class="w-9 h-9 rounded-xl glass-panel flex items-center justify-center text-yellow-400 active:rotate-180 transition-transform duration-500">
                    <i class="fa-solid fa-rotate text-sm" id="sync-icon"></i>
                </button>
                <div class="w-9 h-9 rounded-xl glass-panel flex items-center justify-center text-cyan-400 border border-cyan-500/30">
                    <i class="fa-solid fa-shield-halved text-sm"></i>
                </div>
            </div>
        </header>

        <!-- Main Content Scrollable Area -->
        <main class="flex-grow p-4 pb-24 flex flex-col gap-5 overflow-y-auto">
            
            <!-- Live Status & Markup Indicator Card -->
            <div class="glass-panel p-4 rounded-2xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-yellow-500/10 rounded-full blur-xl pointer-events-none"></div>
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                        <span class="text-[11px] font-mono text-slate-300 tracking-wider">AUTO +20 BS MARKUP ACTIVE</span>
                    </div>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 font-bold border border-yellow-500/40">V2.6 LIVE</span>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2 border-t border-yellow-500/15">
                    <div>
                        <label class="block text-[10px] font-mono text-slate-400 mb-1">BASE RATE (BS / 1000R$)</label>
                        <div class="relative">
                            <input type="number" id="base-rate-input" value="647.00" step="1" class="w-full bg-black/60 border border-yellow-500/30 rounded-xl px-3 py-2 text-sm font-mono font-bold text-yellow-400 focus:outline-none focus:border-yellow-400" oninput="updatePricingMatrix()">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-mono text-slate-400 mb-1">AUTO ADDED MARKUP</label>
                        <div class="bg-black/60 border border-pink-500/30 rounded-xl px-3 py-2 text-sm font-mono font-bold text-pink-400 flex items-center justify-between">
                            <span>+20.00</span>
                            <span class="text-[10px] text-slate-400">Bs.</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search Filter Bar -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Search Robux amount (e.g. 800)..." class="w-full bg-black/50 border border-yellow-500/25 rounded-xl px-4 py-3 pl-10 text-xs font-mono text-white placeholder-slate-500 focus:outline-none focus:border-yellow-400 transition-all" oninput="filterPackages()">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
            </div>

            <!-- Robux Packages Grid List -->
            <div id="packages-list" class="flex flex-col gap-3.5">
                <!-- Populated dynamically via JavaScript -->
            </div>

        </main>

        <!-- Bottom Navigation Bar (Bonoxs Mobile Style) -->
        <footer class="sticky bottom-0 z-40 glass-panel border-t border-yellow-500/20 px-6 py-3 flex items-center justify-between text-xs font-mono">
            <div class="flex items-center gap-2 text-yellow-400">
                <i class="fa-solid fa-wallet"></i>
                <span id="total-tiers-count" class="font-bold">8 Packages</span>
            </div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-400"></i>
                <span>Instant Copy Ready</span>
            </div>
        </footer>

    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type = 'click') {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(783.99, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 1.5 + 0.8,
                color: Math.random() > 0.4 ? '#facc15' : '#00f3ff'
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 0.4;
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 100) {
                        ctx.strokeStyle = `rgba(250, 204, 21, ${0.12 * (1 - dist / 100)})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        const robuxPackages = [
            { id: 1, robux: 400, badge: 'STARTER', icon: 'fa-gem' },
            { id: 2, robux: 800, badge: 'POPULAR', icon: 'fa-fire' },
            { id: 3, robux: 1700, badge: 'BEST VALUE', icon: 'fa-bolt' },
            { id: 4, robux: 2700, badge: 'PRO TIER', icon: 'fa-shield-halved' },
            { id: 5, robux: 3600, badge: 'ADVANCED', icon: 'fa-crown' },
            { id: 6, robux: 4500, badge: 'ELITE GAMER', icon: 'fa-dragon' },
            { id: 7, robux: 10000, badge: 'TYCOON', icon: 'fa-meteor' },
            { id: 8, robux: 22500, badge: 'WHALE', icon: 'fa-infinity' }
        ];

        window.onload = function () {
            updatePricingMatrix();
        };

        function updatePricingMatrix(filteredData = robuxPackages) {
            const baseRateInput = parseFloat(document.getElementById('base-rate-input').value) || 647.00;
            const markupFee = 20.00;
            const container = document.getElementById('packages-list');
            container.innerHTML = '';

            filteredData.forEach(pkg => {
                const supplierCost = baseRateInput * (pkg.robux / 1000);
                const finalRetailPrice = supplierCost + markupFee;
                const unitRate = (finalRetailPrice / pkg.robux).toFixed(4);

                const card = document.createElement('div');
                card.className = 'glass-panel p-4 rounded-2xl flex flex-col gap-3 relative overflow-hidden group active:scale-[0.99] transition-transform';
                card.innerHTML = `
                    <div class="absolute -right-6 -top-6 w-20 h-20 bg-yellow-500/10 rounded-full blur-xl group-hover:bg-yellow-500/25 transition-all pointer-events-none"></div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <div class="w-9 h-9 rounded-xl bg-yellow-500/15 border border-yellow-500/30 flex items-center justify-center text-yellow-400">
                                <i class="fa-solid ${pkg.icon} text-sm"></i>
                            </div>
                            <div>
                                <span class="text-xs font-mono px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 font-bold border border-yellow-500/30">${pkg.badge}</span>
                                <h3 class="text-lg font-black font-mono text-white tracking-tight mt-0.5">${pkg.robux.toLocaleString()} <span class="text-xs font-sans text-yellow-400 font-normal">ROBUX</span></h3>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-mono text-slate-400 block">UNIT RATE</span>
                            <span class="text-xs font-mono text-cyan-400 font-bold">${unitRate} Bs</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 bg-black/40 p-2.5 rounded-xl border border-yellow-500/10 font-mono text-[11px]">
                        <div class="flex flex-col">
                            <span class="text-slate-400">Supplier Base</span>
                            <span class="text-slate-200 font-bold">${supplierCost.toFixed(2)} Bs</span>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="text-slate-400">Markup Added</span>
                            <span class="text-pink-400 font-bold">+${markupFee.toFixed(2)} Bs</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <div>
                            <span class="text-[10px] font-mono text-slate-400 block">FINAL RETAIL PRICE</span>
                            <span class="text-xl font-black font-mono text-yellow-400 tracking-tight">${finalRetailPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs</span>
                        </div>
                        <button onclick="copyPackageDetails(${finalRetailPrice}, ${pkg.robux})" class="bonoxs-yellow-btn px-4 py-2.5 rounded-xl text-xs flex items-center gap-2">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('total-tiers-count').innerText = filteredData.length + ' Packages';
        }

        function filterPackages() {
            playSound('click');
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = robuxPackages.filter(p => p.robux.toString().includes(query) || p.badge.toLowerCase().includes(query));
            updatePricingMatrix(filtered);
        }

        function triggerSync() {
            playSound('click');
            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');
            showToast('Querying Bonoxs live mobile gateway rates...', 'info');

            setTimeout(() => {
                icon.classList.remove('fa-spin');
                const randomShift = (Math.random() * 2 - 1).toFixed(2);
                const currentRate = parseFloat(document.getElementById('base-rate-input').value);
                const newRate = parseFloat((currentRate + parseFloat(randomShift)).toFixed(2));
                document.getElementById('base-rate-input').value = newRate;
                updatePricingMatrix();
                playSound('success');
                showToast('Successfully synchronized Bonoxs mobile rates!', 'success');
            }, 900);
        }

        function copyPackageDetails(priceVal, robuxAmt) {
            playSound('success');
            const textToCopy = `${robuxAmt.toLocaleString()} Robux = ${priceVal.toFixed(2)} Bs (Bonoxs Mobile Auto Price +20)`;
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast(`Copied: ${robuxAmt.toLocaleString()} R$ = ${priceVal.toFixed(2)} Bs`, 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let borderColor = 'border-yellow-500/40';
            let icon = 'fa-circle-check text-yellow-400';
            if (type === 'success') { borderColor = 'border-emerald-500/50'; icon = 'fa-circle-check text-emerald-400'; }
            if (type === 'info') { borderColor = 'border-cyan-500/50'; icon = 'fa-circle-info text-cyan-400'; }

            toast.className = `glass-panel p-3.5 rounded-2xl border ${borderColor} text-xs font-mono text-white flex items-center gap-3 shadow-2xl pointer-events-auto transition-all transform -translate-y-4 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('-translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
